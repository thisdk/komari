name: komari

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "dev"
      - "v*.*.*"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "examples/**"
      - "docs/**"
  pull_request:
    branches:
      - "master"
      - "dev"
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "examples/**"
      - "docs/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OpenCV is the slowest dependency and its cache entry is shared by every
  # other job. Build it once here instead of letting each job race to populate
  # the same cache key.
  prepare:
    name: prepare (OpenCV via vcpkg)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          vcpkg: build
          toolchain: "false"

  test:
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          vcpkg: restore

      # TODO: https://github.com/DioxusLabs/dioxus/issues/3433
      # TODO: Need to add dx fmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test -- --nocapture

  build:
    needs: prepare
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        type: [release, debug]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          vcpkg: restore

      - name: Build ${{ matrix.type }}
        shell: pwsh
        run: |
          $args = "--verbose", "--package", "ui"
          if ("${{ matrix.type }}" -eq "release") {
            $args += "--release"
          }
          dx build @args

      - name: Verify build output
        shell: pwsh
        run: |
          $app = "target/dx/ui/${{ matrix.type }}/windows/app"
          if (-not (Test-Path "$app/ui.exe")) {
            throw "dx build did not produce $app/ui.exe"
          }
          Get-ChildItem $app | Select-Object Name, Length

      - name: Package archive
        shell: pwsh
        run: |
          $app = "target/dx/ui/${{ matrix.type }}/windows/app"
          $stage = "stage/app-${{ matrix.type }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "$app/*" -Destination $stage -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$stage/examples" | Out-Null
          Copy-Item -Path "examples/*" -Destination "$stage/examples" -Recurse -Force
          Copy-Item -Path "kmbox_example.bat" -Destination $stage -Force
          Copy-Item -Path "arduino_example.bat" -Destination $stage -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "app-${{ matrix.type }}.zip" -Force
          Get-Item "app-${{ matrix.type }}.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.type }}
          path: app-${{ matrix.type }}.zip
          if-no-files-found: error

  # Publishing lives in its own job: the two matrix legs would otherwise race
  # to create the same draft release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/*.zip
