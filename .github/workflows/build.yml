name: komari

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "examples/**"
      - "docs/**"
  release:
    types: [published]
  pull_request:
    branches:
      - "master"
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "examples/**"
      - "docs/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # TODO: https://github.com/DioxusLabs/dioxus/issues/3433
      # TODO: Need to add dx fmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test -- --no-capture

  build:
    runs-on: windows-latest

    strategy:
      matrix:
        type: [release, debug]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build ${{ matrix.type }}
        shell: pwsh
        run: |
          $args = "--verbose", "--package", "ui"
          if ("${{ matrix.type }}" -eq "release") {
            $args += "--release"
          }
          dx build @args

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.type }}
          path: target/dx/ui/${{ matrix.type }}/windows/app

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: app-release

      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: app-debug

      - name: Package release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path app-release/* -DestinationPath "komari-$version-release.zip"
          Compress-Archive -Path app-debug/* -DestinationPath "komari-$version-debug.zip"

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "komari-${{ github.ref_name }}-release.zip" "komari-${{ github.ref_name }}-debug.zip" --repo "${{ github.repository }}" --clobber
